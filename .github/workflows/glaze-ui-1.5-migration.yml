name: Align Suite with Glaze UI 1.5 Stable

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/glaze-ui-1.5-migration.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align deploy allowlist and validation
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()
          bundle = root / "glaze-ui-1.5.0.css"
          if not bundle.is_file():
              raise SystemExit("vendored Glaze UI 1.5.0 bundle is missing")

          build = root / "scripts/build_public_site.py"
          text = build.read_text(encoding="utf-8")
          if '"glaze-ui-1.5.0.css"' not in text:
              text = text.replace('    "styles.css",\n', '    "styles.css",\n    "glaze-ui-1.5.0.css",\n', 1)
          build.write_text(text, encoding="utf-8")

          validator = root / "scripts/validate_site.py"
          text = validator.read_text(encoding="utf-8")
          old = 'for label in ("Glaze UI", "Privacy Shield", "Wardveil Security", "Everkeep", "GoreeCloud Mesh"):\n        if html.count(f"<strong>{label}</strong>") != 1:\n            errors.append(f"platform-system contract must appear exactly once in the principle band: {label}")'
          new = 'for label in ("Glaze UI · Design Center", "Privacy Shield · Privacy Center", "Wardveil Security · Security Center", "Everkeep · Continuity Center", "GoreeCloud Mesh · Mesh Center"):\n        if html.count(f"<strong>{label}</strong>") != 1:\n            errors.append(f"platform-system and Center contract must appear exactly once in the principle band: {label}")'
          if old in text:
              text = text.replace(old, new, 1)
          marker = '    css = STYLES.read_text(encoding="utf-8")\n'
          addition = '''    glaze = (ROOT / "glaze-ui-1.5.0.css")\n    if not glaze.is_file():\n        errors.append("vendored Glaze UI 1.5.0 bundle is missing")\n    else:\n        glaze_text = glaze.read_text(encoding="utf-8")\n        for required in ("Glaze UI 1.5.0 Stable", "2c5078410d022eba683c8e029bc3cafe773df0b7", "glaze.states.css", "prefers-reduced-motion"):\n            if required not in glaze_text:\n                errors.append(f"Glaze UI 1.5 bundle marker missing: {required}")\n    if 'name="goreecloud-glaze-ui" content="1.5.0"' not in html or 'data-glaze-ui="1.5.0"' not in html:\n        errors.append("Suite page is not explicitly pinned to Glaze UI 1.5.0")\n'''
          if "Glaze UI 1.5 bundle marker missing" not in text:
              text = text.replace(marker, marker + addition, 1)
          validator.write_text(text, encoding="utf-8")

      - name: Validate and build
        run: |
          python3 scripts/validate_site.py
          python3 scripts/build_public_site.py
          test -f dist/glaze-ui-1.5.0.css
      - name: Commit alignment
        run: |
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add scripts
          if git diff --cached --quiet; then
            echo "Suite Glaze UI 1.5 build contract already aligned"
          else
            git commit -m "Align Suite validation with Glaze UI 1.5 Stable"
            git push
          fi
