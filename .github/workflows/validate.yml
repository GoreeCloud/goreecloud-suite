name: Validate GoreeCloud Suite website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          check-latest: false
      - name: Validate Suite website
        run: python scripts/validate_site.py
      - name: Validate Suite responsive layout
        run: python scripts/validate_responsive_layout.py
      - name: Build isolated public artifact
        run: python scripts/build_public_site.py
      - name: Exercise built Suite responsive layout in Chrome
        run: python scripts/browser_responsive_smoke.py
